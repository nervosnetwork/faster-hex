[package]
name = "faster-hex"
version = "1.0.0-rc.2"
authors = ["zhangsoledad <787953403@qq.com>"]
edition = "2018"
rust-version = "1.95.0"
keywords = ["simd", "hex", "no-std"]
license = "MIT"
description = "Fast, checked hex encoding and decoding with SIMD and no_std support."
repository = "https://github.com/nervosnetwork/faster-hex"
homepage = "https://github.com/nervosnetwork/faster-hex"
readme = "README.md"
exclude = ["afl/*", "benches/*", "fuzz/*", "ci/*", ".github/*", "cliff.toml", "proptest-regressions/*"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
defmt = { version = "0.3", optional = true }
heapless = { version = "0.8", optional = true, default-features = false }
serde = { version = "1.0", default-features = false, optional = true }

[features]
default = ["std", "serde"]
std = ["alloc", "serde?/std"]
alloc = ["defmt?/alloc"]
serde = ["dep:serde", "serde/alloc", "alloc"]
defmt-03 = ["dep:defmt", "heapless?/defmt-03"]
heapless-08 = ["dep:heapless"]

[dev-dependencies]
criterion = "0.5"
const-hex = "1.19"
data-encoding = "2"
hex = "0.4"
hex-simd = "0.8"
libc = "0.2"
proptest = "1.0"
serde = { version = "1.0", features = ["derive"] }
bytes = { version = "1.4.0" }
serde_json = { version = "1.0" }
postcard = { version = "1.1.3", default-features = false }

[[bench]]
name = "hex"
harness = false
required-features = ["std"]

[[bench]]
name = "check"
harness = false
required-features = ["std"]

[[bench]]
name = "serde"
harness = false
required-features = ["std", "serde"]

[[bench]]
name = "owned"
harness = false
required-features = ["std"]

[[bench]]
name = "format"
harness = false
required-features = ["std"]

[[bench]]
name = "mixed"
harness = false
required-features = ["std"]

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
