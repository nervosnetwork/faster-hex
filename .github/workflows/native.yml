name: Native x86 benchmarks

on:
  push:
    branches: [zhangsoledad/native-bench-3b9fdf2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-benchmark-${{ github.sha }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: never

jobs:
  benchmark:
    name: Native benchmark / ${{ matrix.os }} / ${{ matrix.sample }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sample: 1
          - os: ubuntu-24.04
            sample: 2
          - os: ubuntu-24.04
            sample: 3
          - os: ubuntu-22.04
            sample: 1
          - os: ubuntu-22.04
            sample: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - run: python3 ci/native_benchmark.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-benchmark-${{ matrix.os }}-${{ matrix.sample }}-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            target/native-benchmark/*.json
            target/native-benchmark/*.log
            target/native-benchmark/criterion
            target/native-benchmark/coverage/*.json
            target/native-benchmark/coverage/*.log
            ci/native-bench.lock
          if-no-files-found: error
