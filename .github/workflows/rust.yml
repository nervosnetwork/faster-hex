name: Check the source, version and release comparisons on native runners
on: workflow_dispatch
permissions:
  contents: read
jobs:
  controls:
    name: Verify all three controls and validation boundaries / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel]
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Rebuild each control independently from the declared refs
        shell: bash
        run: |
          rustc -Vv
          python3 verify/verify_three_comparisons.py "$PWD" "$RUNNER_TEMP/controls" 6d84260fe321669e7f93ecfb8aecb4db0f582f14 b7bac93ce485dcd1fcdddcdb390f0b4aaf01e019
      - name: Check the benchmark cases shared with 2.0.0
        shell: bash
        run: |
          for role in baseline head; do
            (cd "$RUNNER_TEMP/controls/source/$role" && cargo --locked bench-dev --list) > "$RUNNER_TEMP/$role.list"
            awk '/: benchmark$/ { print }' "$RUNNER_TEMP/$role.list" | LC_ALL=C sort > "$RUNNER_TEMP/$role.cases"
          done
          grep -Fx 'encode/faster_hex/32: benchmark' "$RUNNER_TEMP/baseline.cases"
          diff -u "$RUNNER_TEMP/baseline.cases" "$RUNNER_TEMP/head.cases"
          wc -l "$RUNNER_TEMP/baseline.cases"
      - name: Exercise the whole input validation contract on the candidate
        shell: bash
        run: |
          cd "$RUNNER_TEMP/controls/source/head"
          cargo test --locked --release --all-features --test public_api
          cargo test --locked --release --no-default-features --test public_api
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controls-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/controls/images.json
            ${{ runner.temp }}/baseline.cases
            ${{ runner.temp }}/head.cases
          if-no-files-found: error
