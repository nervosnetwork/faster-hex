name: Diagnose the measured checked decode programs
on: workflow_dispatch
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  compare:
    name: ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, lto: thin }
          - { os: macos-15-intel, lto: "false" }
          - { os: ubuntu-24.04-arm, lto: thin }
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Profile the checked backends and compare their code placement at the same crate identity
        env:
          CELL: ${{ matrix.os }}-lto-${{ matrix.lto }}
        run: python verify/layout-probe.py "$CELL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: placement-${{ matrix.os }}-lto-${{ matrix.lto }}
          path: out
          if-no-files-found: error
