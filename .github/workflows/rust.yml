name: Relink the sampled Intel benchmark functions at equal addresses
on: workflow_dispatch
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  compare:
    name: ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        lto: ["false", thin]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Link the same object files twice, verify the sampled addresses, and compare in both run orders
        env:
          CELL: ${{ matrix.os }}-lto-${{ matrix.lto }}
        run: python verify/measure-mac-order.py "$CELL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mac-order-${{ matrix.os }}-lto-${{ matrix.lto }}
          path: out
          if-no-files-found: error
