name: Native validation diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_PROFILE_BENCH_LTO: thin
  CARGO_INCREMENTAL: "0"
jobs:
  study:
    name: ${{ matrix.os }} / replica ${{ matrix.replica }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, replica: 1 }
          - { os: ubuntu-24.04, replica: 2 }
          - { os: ubuntu-24.04, replica: 3 }
          - { os: macos-15-intel, replica: 4 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: python3 .github/validation-study.py ${{ matrix.replica }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: measurements-${{ matrix.replica }}
          path: study/results
