name: Check dispatch on five x86 CPU models
on: workflow_dispatch
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  fallback:
    name: Exercise the x86 dispatch fallback cases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0b9d4cb727eedb962506179fa36dd524b5b2a356
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Install the test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-user
      - name: Check x86 dispatch with missing CPU features
        env:
          RUSTFLAGS: -D warnings
        run: |
          while read -r cpu expected; do
            echo "$cpu -> $expected"
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="qemu-x86_64 -cpu $cpu" \
              FASTER_HEX_EXPECT_BACKEND="$expected" cargo test --release --all-features \
                --target x86_64-unknown-linux-gnu --lib tests::feature_detection_matches_host -- --exact
          done <<'CPUS'
          Conroe None
          Nehalem SSE41
          SandyBridge,-xsave,-avx SSE41
          SandyBridge SSE41
          Haswell-noTSX AVX2
          CPUS
