name: Test placement of the 25-byte error scan on native x86
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  measure:
    name: ${{ matrix.os }} / ${{ matrix.replica }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [one, two]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native code identity and measure the same loop at three offsets
        run: python3 verify/placement/measure.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scan-placement-${{ matrix.os }}-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/placement-evidence/samples.json
            ${{ runner.temp }}/placement-evidence/host.txt
            ${{ runner.temp }}/placement-evidence/symbol-addresses.txt
