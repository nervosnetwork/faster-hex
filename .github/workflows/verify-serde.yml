name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  slices:
    name: Initialized slice boundaries / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
      REFERENCE_REV: 07e94ccd19fc6e1d26f295d4a1c8d37cdcd80e3e
      PRODUCT_REV: b0e8c2695f27a5f4e77199243780982bdda8ffe3
      CHECK_UNCHANGED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Check the verified product tree and native library tests
        if: matrix.lto == 'false'
        run: |
          test "$(git rev-parse "${PRODUCT_REV}^{tree}")" = acee7e085501b8b45c30169cf491b859aeab0047
          mkdir product
          git archive "$PRODUCT_REV" | tar -xf - -C product
          cd product
          cargo test --release --all-features --quiet
          cargo check --no-default-features --quiet
      - name: Compare independent core and serializer executables
        run: STUDY_WORK=core-work RESULTS=results/core python3 verify/consumer.py
      - name: Compare complete JSON callers
        run: STUDY_WORK=json-work RESULTS=results/json PAIR_STUDY=json MIXED_CALLER=1 FIELD_OBJECTS=1 python3 verify/consumer.py
      - name: Compare fixed and optional fields
        run: STUDY_WORK=field-work RESULTS=results/fields PAIR_STUDY=fixed ARRAY_VARIANT=frozen OWNED_VECTORS=1 RELEASE_FIELDS=1 FIELD_OBJECTS=1 python3 verify/consumer.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: typed-slices-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/*/host.txt
            results/*/sections.json
            results/*/independent-summary.json
