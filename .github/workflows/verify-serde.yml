name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  fields:
    name: Fixed JSON fields / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, ubuntu-24.04-arm]
        lto: ["false", thin]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Run the maintained eight fixed-field benchmarks in both orders
        run: python3 verify/fixed_field_matrix.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixed-fields-${{ matrix.os }}-${{ matrix.lto }}
          path: results/fixed-fields.json
          if-no-files-found: error
