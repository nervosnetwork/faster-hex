name: Prove slice and dispatch contracts
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 42c484112239d78a943735d97125e356f123224a
          path: candidate
          persist-credentials: false
      - name: Load proof harnesses for Kani only
        run: |
          cp proof/verify/proof_contracts.rs candidate/src/proof_contracts.rs
          printf '\n#[cfg(kani)]\nmod proof_contracts;\n' >> candidate/src/lib.rs
      - uses: model-checking/kani-github-action@daca1b75a96ce3884435ebaeeb73073ffa7edfbd
        with:
          kani-version: '0.68.0'
          working-directory: candidate
          args: --lib --no-default-features --harness proof_contracts --output-format terse
