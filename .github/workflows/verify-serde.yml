name: Native codec release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  native:
    name: Released codec and isolated changes / Intel / LTO ${{ matrix.lto }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Isolate the encoder, decoder, error scan and owned result path
        run: python3 verify/components.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-source-components-intel-${{ matrix.lto }}
          path: results
