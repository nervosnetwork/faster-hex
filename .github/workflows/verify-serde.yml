name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  profile:
    name: Profile standalone JSON calls / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, lto: "false" }
          - { os: ubuntu-24.04, lto: "false" }
          - { os: ubuntu-24.04, lto: "thin" }
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
      PRODUCT_REV: dec48432d8ac3df9d6a15a265fbac66fb850b292
      REFERENCE_REV: 25cfd8eb6a4cd8257a96fabaf73771cabcced4b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Make a user-space profiler available for the standalone executables
        run: |
          if ! command -v valgrind >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends valgrind
          fi
      - name: Measure separately built complete calls
        run: FIELD_OBJECTS=1 MIXED_CALLER=1 PAIR_STUDY=matched RESULTS=results/paired python3 verify/consumer.py
      - name: Profile the same executables with their original release code
        run: python3 verify/standalone_profile.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: isolated-profile-${{ matrix.os }}-${{ matrix.lto }}
          path: results
