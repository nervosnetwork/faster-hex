name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  json:
    name: JSON CPU samples / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, lto: "false"}
          - {os: ubuntu-22.04, lto: "thin"}
          - {os: ubuntu-24.04, lto: "false"}
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
      PRODUCT_REV: 9fa6d71209957bd5e03c8f6ff39bb3fd59ac8685
      REFERENCE_REV: 25cfd8eb6a4cd8257a96fabaf73771cabcced4b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Build and measure the two complete callers
        run: PAIR_STUDY=json FIELD_OBJECTS=1 MIXED_CALLER=1 RESULTS=results/roundtrip python3 verify/consumer.py
      - name: Install the userspace CPU sampler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends google-perftools libgoogle-perftools4
      - name: Run matched-path timings and collect CPU samples
        run: python3 verify/timed_json_cpu.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cpu-json-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/cpu
            results/roundtrip/host.txt
            results/roundtrip/sections.json
            results/roundtrip/independent-summary.json
