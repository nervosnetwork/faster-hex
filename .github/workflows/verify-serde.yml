name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  common-writer:
    name: Same writer after either reader / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, lto: "false"}
          - {os: ubuntu-22.04, lto: "thin"}
          - {os: ubuntu-24.04, lto: "false"}
          - {os: ubuntu-24.04-arm, lto: "false"}
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Cross both readers with one writer and repeat with reversed crate order
        run: python3 verify/cross_readers.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: same-writer-${{ matrix.os }}-${{ matrix.lto }}
          path: crossed-readers/results
