name: Locate short JSON costs in native package consumers
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / ${{ matrix.profile }} / ${{ matrix.isa }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, profile: thin, isa: runtime }
          - { os: ubuntu-24.04, profile: default, isa: runtime }
          - { os: ubuntu-24.04-arm, profile: default, isa: runtime }
          - { os: ubuntu-24.04-arm, profile: thin, isa: runtime }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nervosnetwork/ckb
          ref: 2061bc092a5dd447a741fad03b02628203b35e96
          path: real/ckb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitoxideLabs/gitoxide
          ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38
          path: real/gitoxide
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: |
          if [[ "$PROFILE" == thin ]]; then export CARGO_PROFILE_RELEASE_LTO=thin; fi
          python3 verify/isolate_callers.py
          if [[ "$SHORT_JSON_LAYOUT" == 1 ]]; then python3 verify/short_json_sites.py; fi
        shell: bash
        env:
          ISOLATE: short-json
          PROFILE: ${{ matrix.profile }}
          SHORT_JSON_LAYOUT: ${{ matrix.os == 'ubuntu-24.04-arm' && '1' || '0' }}
          SHORT_JSON_LIGHT: ${{ matrix.os != 'ubuntu-24.04-arm' && '1' || '0' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: short-json-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.isa }}
          path: |
            real/qualification/archives.json
            real/qualification/*/*.json
            real/qualification/*/*.txt
            real/short-json-sites/*.json
      - name: Exercise both isolated changes
        shell: bash
        run: |
          for revision in fc834c71026b6d7f81738b53bd73237f408474ff 3ab653f0ba171618dd175d70331c556d11a9cc08; do
            git worktree add --detach "$RUNNER_TEMP/$revision" "$revision"
            (cd "$RUNNER_TEMP/$revision" && cargo test --release --all-features)
          done
