name: Native Serde performance checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  native:
    name: ${{ matrix.family }} / ${{ matrix.mode }} / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: kernel, mode: mixed_profile, os: ubuntu-22.04, lto: "thin"}
          - {family: kernel, mode: mixed_profile, os: ubuntu-24.04, lto: "thin"}
          - {family: kernel, mode: mixed, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: kernel, mode: regress, os: ubuntu-22.04, lto: "thin"}
          - {family: kernel, mode: regress, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: field, mode: mixed, os: ubuntu-22.04, lto: "thin"}
          - {family: field, mode: mixed, os: ubuntu-24.04, lto: "thin"}
          - {family: field, mode: mixed, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: field, mode: regress, os: ubuntu-22.04, lto: "thin"}
          - {family: field, mode: regress, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: safe, mode: mixed_profile, os: ubuntu-22.04, lto: "thin"}
          - {family: safe, mode: mixed_profile, os: ubuntu-24.04, lto: "thin"}
          - {family: safe, mode: mixed, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: safe, mode: regress, os: ubuntu-22.04, lto: "thin"}
          - {family: safe, mode: regress, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: safe, mode: fields, os: ubuntu-22.04, lto: "thin"}
          - {family: safe, mode: fields, os: ubuntu-24.04, lto: "thin"}
          - {family: safe, mode: fields, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: field, mode: existing, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: kernel, mode: existing, os: ubuntu-24.04-arm, lto: "thin"}
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: |
          case "${{ matrix.family }}" in
            kernel) PRODUCT_REV=054b3e96fc1340b99b2f49e359bd6d7d0a9e4191 ;;
            field) PRODUCT_REV=4c07689f1dab13a811fb0b02a6cbe6a8fc948466 ;;
            safe) PRODUCT_REV=5a9f8fa98d45e3a45d386ba536298c993789a056 ;;
          esac
          export PRODUCT_REV
          if [ "${{ matrix.mode }}" = fields ]; then
            RELEASE_FIELDS=1 ARRAY_VARIANT=frozen python3 verify/consumer.py
          elif [ "${{ matrix.mode }}" = existing ]; then
            EXISTING_CONTROLS=1 python3 verify/consumer.py
          elif [ "${{ matrix.mode }}" = layout ]; then
            python3 verify/writer_layout.py
          elif [ "${{ matrix.mode }}" = owned ]; then
            OWNED_WRITER=1 python3 verify/shared_writer.py
          elif [ "${{ matrix.mode }}" = mixed_profile ]; then
            MIXED_CALLER=1 python3 verify/consumer.py
            python3 verify/profile_caller.py
          elif [ "${{ matrix.mode }}" = mixed ]; then
            MIXED_CALLER=1 python3 verify/consumer.py
          elif [ "${{ matrix.mode }}" = isolated ]; then
            ISOLATED_WRITER=1 WRITER_FOCUS=1 python3 verify/regress.py
          else
            python3 verify/regress.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-${{ matrix.family }}-${{ matrix.mode }}-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/profile.json
            results/writer-layout.json
            results/shared-writer.json
            results/host.txt
            results/sections.json
            results/independent-summary.json
            results/measurements.json
            results/verdict.json
            results/copy-spacing.txt
