name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  consumers:
    name: CKB JsonBytes and gix ObjectId / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, ubuntu-24.04-arm]
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nervosnetwork/ckb
          ref: 2061bc092a5dd447a741fad03b02628203b35e96
          path: real/ckb
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitoxideLabs/gitoxide
          ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38
          path: real/gitoxide
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Compare the same callers at the 2.0 tag, PR head and Serde candidate
        run: python3 verify/downstream/measure.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: downstream-${{ matrix.os }}-${{ matrix.lto }}
          path: results
