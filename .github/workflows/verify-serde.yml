name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  scratch:
    name: Serde writer buffer / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        lto: ["false", "thin"]
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Keep the writer, source bytes, output and temporary text at fixed addresses
        run: python3 verify/writer_storage.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: writer-buffer-${{ matrix.os }}-${{ matrix.lto }}
          path: writer-buffer-work/results

  reader:
    name: Profile ordinary from_reader on ARM / LTO ${{ matrix.lto }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Install native CPU sampling support
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y google-perftools libgoogle-perftools-dev
      - name: Rebuild the original array and Vec readers and profile their hot instructions
        run: python3 verify/profile_reader.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reader-arm-${{ matrix.lto }}
          path: reader-profile
