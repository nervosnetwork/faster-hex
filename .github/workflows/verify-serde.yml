name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  release:
    name: AVX2 character classes / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-22.04]
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
      PRODUCT_REV: b98282ebb38ef88d8738d303874e1466a89345ae
      REFERENCE_REV: 25cfd8eb6a4cd8257a96fabaf73771cabcced4b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Check every input byte at vector boundaries
        run: |
          cp verify/core-inputs.rs tests/native_inputs.rs
          cargo test --release --all-features --lib --test native_inputs --test public_api --test owned_decode
      - name: Compare with the PR on intact downstream calls
        run: KERNEL_CASES=mask RESULTS=results/pr python3 verify/consumer.py
      - name: Compare with the released decoder and checker
        env:
          REFERENCE_REV: 6d84260fe321669e7f93ecfb8aecb4db0f582f14
        run: KERNEL_CASES=mask KERNEL_FOCUS=1 RESULTS=results/release python3 verify/consumer.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.lto }}
          path: results
