name: Native Serde performance checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  native:
    name: ${{ matrix.family }} / ${{ matrix.mode }} / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: typed_slices, mode: short, os: ubuntu-22.04, lto: "thin"}
          - {family: typed_slices, mode: short, os: ubuntu-24.04, lto: "thin"}
          - {family: typed_slices, mode: short, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: borrowed_four, mode: short, os: ubuntu-22.04, lto: "thin"}
          - {family: borrowed_four, mode: short, os: ubuntu-24.04, lto: "thin"}
          - {family: borrowed_four, mode: short, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: private_pairs, mode: short, os: ubuntu-22.04, lto: "thin"}
          - {family: private_pairs, mode: short, os: ubuntu-24.04, lto: "thin"}
          - {family: private_pairs, mode: short, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: typed_kernel, mode: short, os: ubuntu-22.04, lto: "thin"}
          - {family: typed_kernel, mode: short, os: ubuntu-24.04, lto: "thin"}
          - {family: typed_kernel, mode: short, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: typed_slices, mode: focused, os: ubuntu-22.04, lto: "false"}
          - {family: typed_slices, mode: focused, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: borrowed_four, mode: focused, os: ubuntu-22.04, lto: "false"}
          - {family: borrowed_four, mode: focused, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: private_pairs, mode: focused, os: ubuntu-22.04, lto: "false"}
          - {family: private_pairs, mode: focused, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: typed_kernel, mode: focused, os: ubuntu-22.04, lto: "false"}
          - {family: typed_kernel, mode: focused, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: typed_slices, mode: edge, os: ubuntu-22.04, lto: "thin"}
          - {family: typed_slices, mode: edge, os: ubuntu-24.04-arm, lto: "thin"}
          - {family: typed_slices, mode: edge, os: macos-15-intel, lto: "thin"}
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: |
          case "${{ matrix.family }}" in
            typed_slices) PRODUCT_REV=$(sed -n '1p' verify/targets) ;;
            borrowed_four) PRODUCT_REV=$(sed -n '2p' verify/targets) ;;
            private_pairs) PRODUCT_REV=$(sed -n '3p' verify/targets) ;;
            typed_kernel) PRODUCT_REV=$(sed -n '4p' verify/targets) ;;
          esac
          export PRODUCT_REV
          if [ "${{ matrix.mode }}" = short ]; then
            SHORT_FIELDS=1 ARRAY_VARIANT=frozen python3 verify/consumer.py
          elif [ "${{ matrix.mode }}" = edge ]; then
            ESCAPED_ARRAYS=1 ARRAY_VARIANT=frozen python3 verify/consumer.py
          else
            FOCUS_REGRESS=1 python3 verify/regress.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-${{ matrix.family }}-${{ matrix.mode }}-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/host.txt
            results/sections.json
            results/independent-summary.json
            results/measurements.json
            results/verdict.json
            results/copy-spacing.txt
