name: Native Serde performance checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  native:
    name: ${{ matrix.family }} / ${{ matrix.mode }} / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        lto: ["false", "thin"]
        mode: [fields, mixed]
        family: [field-result]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Compare released callers
        env:
          PRODUCT_REV: 669d692d8c2f493d6e1b6d7f51c75d300de4a005
          CHECK_UNCHANGED: 1
        run: |
          if [ "${{ matrix.mode }}" = mixed ]; then
            MIXED_CALLER=1 python3 verify/consumer.py
          else
            RELEASE_FIELDS=1 ARRAY_VARIANT=frozen python3 verify/consumer.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-${{ matrix.family }}-${{ matrix.mode }}-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/placement.json
            results/profile.json
            results/writer-layout.json
            results/shared-writer.json
            results/host.txt
            results/sections.json
            results/independent-summary.json
            results/measurements.json
            results/verdict.json
            results/copy-spacing.txt
