name: Verify isolated decoder fixes against the published 4 KiB path on EPYC 7763
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  checks:
    name: Check CPU and run EPYC 7763 comparison (${{ matrix.probe }})
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2, 3, 4]
    env:
      EPHEMERAL_BUILD: "1"
      AUDIT_SHA: 25cfd8eb6a4cd8257a96fabaf73771cabcced4b4
    steps:
      - name: Record physical CPU
        id: cpu
        shell: bash
        run: |
          model=$(LC_ALL=C lscpu | sed -n 's/^Model name:[[:space:]]*//p')
          echo "CPU: $model"
          if [[ "$model" == "AMD EPYC 7763 64-Core Processor" ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cpu.outputs.match == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.cpu.outputs.match == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nervosnetwork/ckb
          ref: 2061bc092a5dd447a741fad03b02628203b35e96
          path: real/ckb
          persist-credentials: false
      - if: steps.cpu.outputs.match == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitoxideLabs/gitoxide
          ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38
          path: real/gitoxide
          persist-credentials: false
      - if: steps.cpu.outputs.match == 'true'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Cross release and PR programs over the same executable files
        if: steps.cpu.outputs.match == 'true'
        shell: bash
        env:
          ISOLATE: release-audit
          PROFILE: thin
          HOST_KEY: ubuntu-22.04-thin-runtime
        run: |
          if [[ "$PROFILE" == thin ]]; then export CARGO_PROFILE_RELEASE_LTO=thin; fi
          python3 verify/selected_7763.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.cpu.outputs.match == 'true'
        with:
          name: selected-7763-${{ matrix.probe }}
          path: |
            real/qualification/archives.json
            real/qualification/*/*.json
            real/qualification/*/*/*.json
