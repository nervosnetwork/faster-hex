name: Confirm the integrated release and selected prefix writes
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / ${{ matrix.profile }} / ${{ matrix.isa }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, profile: thin, isa: runtime }
          - { os: ubuntu-24.04, profile: default, isa: runtime }
          - { os: ubuntu-24.04-arm, profile: default, isa: runtime }
          - { os: ubuntu-24.04-arm, profile: thin, isa: runtime }
    env:
      COMBINED_SHA: 518128a32856beed0436b53e450ad7a34652eb4b
      WINDOWS_SHA: 1009af415033f1348184846c5dd2defe73d3b794
      SELECTED_SHA: f644d94914f90127dfe2f3eb697fd5575eea8e85
      AUDIT_SHA: fc834c71026b6d7f81738b53bd73237f408474ff
      INTEGRATED_CONFIRM: "1"
      EPHEMERAL_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nervosnetwork/ckb
          ref: 2061bc092a5dd447a741fad03b02628203b35e96
          path: real/ckb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitoxideLabs/gitoxide
          ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38
          path: real/gitoxide
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Check selected prefix output at guard pages
        shell: bash
        run: |
          for revision in "$COMBINED_SHA" "$SELECTED_SHA" "$WINDOWS_SHA"; do
            git worktree add --detach "$RUNNER_TEMP/$revision" "$revision"
            cat verify/guarded_prefix_addition.rs >> "$RUNNER_TEMP/$revision/src/tests/guarded.rs"
            (cd "$RUNNER_TEMP/$revision" && CARGO_TARGET_DIR="$RUNNER_TEMP/fmt-tests" cargo test --release --all-features)
          done
      - run: |
          if [[ "$PROFILE" == thin ]]; then export CARGO_PROFILE_RELEASE_LTO=thin; fi
          python3 verify/isolate_callers.py
        shell: bash
        env:
          ISOLATE: release-audit
          PROFILE: ${{ matrix.profile }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integrated-confirm-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.isa }}
          path: |
            real/qualification/archives.json
            real/qualification/*/*.json
            real/qualification/*/*.txt
