name: Native codec release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  native:
    name: ${{ matrix.family }} / ${{ matrix.mode }} / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, ubuntu-24.04-arm]
        lto: ["false", "thin"]
        mode: [existing]
        family: [released-core]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Compare 2.0 and the proposed core in separate executables
        env:
          REFERENCE_REV: 6d84260fe321669e7f93ecfb8aecb4db0f582f14
          PRODUCT_REV: 04ff3d5be797fcecd97135e42a295fc92e2e6c20
        run: |
          RELEASE_COMMON=1 python3 verify/consumer.py
          python3 verify/release32.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-${{ matrix.family }}-${{ matrix.mode }}-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/host.txt
            results/release32.json
            results/sections.json
            results/independent-summary.json
