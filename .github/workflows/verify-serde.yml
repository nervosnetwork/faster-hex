name: Check existing decode errors and the cold recovery call
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / ${{ matrix.profile }} / ${{ matrix.isa }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, profile: thin, isa: runtime }
          - { os: ubuntu-24.04, profile: default, isa: runtime }
          - { os: ubuntu-24.04-arm, profile: default, isa: runtime }
          - { os: ubuntu-24.04-arm, profile: thin, isa: runtime }
    env:
      GROUPED_SHA: 8800debd7a36c84ba8a0ec455b9d1c4705cad6ba
      SINGLE_SHA: 5ea9c7a3bb98706a5dcfa7eb36b0b37920109f4d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nervosnetwork/ckb
          ref: 2061bc092a5dd447a741fad03b02628203b35e96
          path: real/ckb
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitoxideLabs/gitoxide
          ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38
          path: real/gitoxide
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: |
          if [[ "$PROFILE" == thin ]]; then export CARGO_PROFILE_RELEASE_LTO=thin; fi
          python3 verify/isolate_callers.py
          if [[ "$LEGACY_SITES" == 1 ]]; then python3 verify/legacy_site_times.py; fi
        shell: bash
        env:
          ISOLATE: legacy-errors
          LEGACY_SITES: ${{ matrix.os == 'ubuntu-24.04-arm' && '1' || '0' }}
          LEGACY_LIGHT: ${{ matrix.os != 'ubuntu-24.04-arm' && '1' || '0' }}
          PROFILE: ${{ matrix.profile }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: legacy-errors-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.isa }}
          path: |
            real/qualification/archives.json
            real/qualification/*/*.json
            real/qualification/*/*.txt
            real/legacy-sites/*.json
            real/legacy-sites/*/*.json
            real/legacy-sites/*/capture-error.txt
      - name: Test both changes
        shell: bash
        run: |
          for rev in "$GROUPED_SHA" "$SINGLE_SHA"; do
            git worktree add --detach "$RUNNER_TEMP/$rev" "$rev"
            (cd "$RUNNER_TEMP/$rev" && cargo test --release --all-features)
          done
