name: Native Serde performance checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  native:
    name: ${{ matrix.family }} / ${{ matrix.mode }} / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        family: [text_bulk, large_place, large_place_outline]
        os: [ubuntu-22.04, ubuntu-24.04]
        mode: [consumer]
        lto: [thin]
        include:
          - {family: text_bulk, mode: consumer, os: ubuntu-24.04-arm, lto: thin}
          - {family: text_bulk, mode: consumer, os: macos-15-intel, lto: thin}
          - {family: text_bulk, mode: regress, os: ubuntu-22.04, lto: thin}
          - {family: text_bulk, mode: regress, os: ubuntu-24.04-arm, lto: thin}
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - run: |
          case "${{ matrix.family }}" in
            text_bulk) PRODUCT_REV=$(sed -n '1p' verify/targets) ;;
            large_place) PRODUCT_REV=$(sed -n '2p' verify/targets) ;;
            large_place_outline) PRODUCT_REV=$(sed -n '3p' verify/targets) ;;
          esac
          export PRODUCT_REV
          if [ "${{ matrix.mode }}" = consumer ]; then
            if [ "$(uname -s)" = Linux ]; then
              mkdir -p results
              cc -O2 -fno-builtin-memcpy verify/spacing.c -o /tmp/copy-timing
              /tmp/copy-timing > results/copy-spacing.txt
            fi
            FOCUSED_FIELDS=1 ARRAY_VARIANT=frozen python3 verify/consumer.py
          else
            python3 verify/regress.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: study-${{ matrix.family }}-${{ matrix.mode }}-${{ matrix.os }}-${{ matrix.lto }}
          path: |
            results/host.txt
            results/sections.json
            results/independent-summary.json
            results/measurements.json
            results/verdict.json
            results/copy-spacing.txt
