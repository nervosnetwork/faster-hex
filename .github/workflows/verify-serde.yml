name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
jobs:
  consumers:
    name: Checked short hex and real callers / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04-arm, lto: "false"}
          - {os: ubuntu-24.04-arm, lto: "thin"}
          - {os: ubuntu-24.04, lto: "false"}
          - {os: ubuntu-24.04, lto: "thin"}
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nervosnetwork/ckb
          ref: 2061bc092a5dd447a741fad03b02628203b35e96
          path: real/ckb
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GitoxideLabs/gitoxide
          ref: a7e739482cd6fe357ca8ebdbf82da5f1945e3e38
          path: real/gitoxide
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Build the same callers with 2.0, the PR and the NEON candidate
        run: CKB_COMPONENTS=1 BUILD_CALLERS_ONLY=1 python3 verify/downstream/measure.py
      - name: Check short vectors, guard pages and output preservation
        working-directory: real/codec
        run: cargo test --release --all-features --lib --test public_api --test owned_decode
      - name: Compare CKB phases, gix parsing and short decoded lengths on ARM
        if: matrix.os == 'ubuntu-24.04-arm'
        run: python3 verify/downstream/components.py
      - name: Verify identical x86 code and execute each program
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json, subprocess
          sections=json.loads(Path("results/sections.json").read_text())
          for name, args in (("ckb_caller",["32","plain"]),("ckb_read",["32","escaped"]),("ckb_write",["4096","plain"]),("gix_caller",["20","parse"]),("lane_decode",["32","mixed"])):
              assert sections["pr/"+name] == sections["select/"+name], name
              subprocess.run(["real/select-"+name,*args,"128"], check=True)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: short-neon-callers-${{ matrix.os }}-${{ matrix.lto }}
          path: results
