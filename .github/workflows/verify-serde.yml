name: Native 2.1 release checks
on:
  push:
    branches: [zhangsoledad/verify-2.1-serde]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
jobs:
  codec:
    name: AVX2 case sets / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-22.04]
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
      PRODUCT_REV: a633e842599227366c67cfabac8a439618274585
      REFERENCE_REV: 25cfd8eb6a4cd8257a96fabaf73771cabcced4b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Check every input byte at vector boundaries
        run: |
          mkdir codec-verify
          git archive "$PRODUCT_REV" | tar -xf - -C codec-verify
          cp verify/core-inputs.rs codec-verify/tests/native_inputs.rs
          cd codec-verify
          cargo test --release --all-features --lib --test native_inputs --test public_api --test owned_decode
      - name: Compare public callers with the PR and the 2.0 release
        run: |
          KERNEL_CASES=mask KERNEL_FOCUS=cases RESULTS=results/pr python3 verify/consumer.py
          REFERENCE_REV=6d84260fe321669e7f93ecfb8aecb4db0f582f14 KERNEL_CASES=mask KERNEL_FOCUS=cases RESULTS=results/release python3 verify/consumer.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cases-${{ matrix.os }}-${{ matrix.lto }}
          path: results
  fields:
    name: Serde field destinations / ${{ matrix.os }} / LTO ${{ matrix.lto }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        lto: ["false", "thin"]
    env:
      CARGO_PROFILE_BENCH_LTO: ${{ matrix.lto }}
      PRODUCT_REV: 2b715dea174460f3c2fbbe50efc793872b1de0e9
      REFERENCE_REV: 25cfd8eb6a4cd8257a96fabaf73771cabcced4b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.95.0
      - name: Check temporary field allocations and format errors
        run: cargo test --release --all-features --test allocations --test serde_protocol
      - name: Compare independent complete JSON calls
        run: MIXED_CALLER=1 RESULTS=results/roundtrip python3 verify/consumer.py
      - name: Compare array fields, option framing and vector decoding
        run: RELEASE_FIELDS=1 ARRAY_VARIANT=frozen OWNED_VECTORS=1 RESULTS=results/fields python3 verify/consumer.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fields-${{ matrix.os }}-${{ matrix.lto }}
          path: results
